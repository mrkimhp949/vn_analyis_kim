# Google Cloud Build configuration for Cloud Run deployment
# This file enables automatic builds and deployments from GitHub

steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vn-trading-bot:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/$PROJECT_ID/vn-trading-bot:latest'
      - '-f'
      - 'Dockerfile'
      - '.'
    timeout: 1800s  # 30 minutes for large dependencies

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vn-trading-bot:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/vn-trading-bot:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'vn-trading-bot'
      - '--image'
      - 'gcr.io/$PROJECT_ID/vn-trading-bot:$COMMIT_SHA'
      - '--region'
      - 'asia-southeast1'  # Singapore region (closest to Vietnam)
      - '--platform'
      - 'managed'
      - '--memory'
      - '2Gi'  # 2GB RAM
      - '--cpu'
      - '1'
      - '--timeout'
      - '300'  # 5 minutes timeout
      - '--max-instances'
      - '1'  # Free tier friendly
      - '--allow-unauthenticated'  # Public access (change if you need auth)
      - '--set-env-vars'
      - 'PORT=8080'

# Use high-performance machine for building
options:
  machineType: 'E2_HIGHCPU_8'
  logging: CLOUD_LOGGING_ONLY

# Build timeout
timeout: 2400s  # 40 minutes total

# Images to store
images:
  - 'gcr.io/$PROJECT_ID/vn-trading-bot:$COMMIT_SHA'
  - 'gcr.io/$PROJECT_ID/vn-trading-bot:latest'
