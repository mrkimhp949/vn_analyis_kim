services:
  - type: web
    name: trading-bot
    env: python
    plan: free
    region: singapore
    buildCommand: |
      pip install -r requirements.txt
      mkdir -p logs backtest_results models data_cache
    startCommand: python main.py
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
      - key: TELEGRAM_TOKEN
        fromService:
          type: secret
          name: telegram-token
      - key: CHAT_ID
        fromService:
          type: secret
          name: chat-id

secrets:
  - name: telegram-token
    description: "Telegram Bot Token"
  - name: chat-id
    description: "Telegram Chat ID"
